<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能视频剪辑</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f13; color: #fff; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 24px 32px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.header h1 { font-size: 24px; background: linear-gradient(90deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header p { font-size: 14px; color: #94a3b8; margin-top: 4px; }
.container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
.card { background: #1a1a2e; border-radius: 16px; padding: 24px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); }
.card h2 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.upload-zone { border: 2px dashed rgba(99,102,241,0.4); border-radius: 12px; padding: 60px 20px; text-align: center; cursor: pointer; transition: all .3s; background: rgba(99,102,241,0.05); }
.upload-zone:hover { border-color: #6366f1; background: rgba(99,102,241,0.1); }
.upload-zone.active { border-color: #22c55e; background: rgba(34,197,94,0.1); }
.upload-icon { font-size: 48px; margin-bottom: 12px; }
.upload-text { font-size: 16px; color: #94a3b8; }
.upload-hint { font-size: 13px; color: #64748b; margin-top: 8px; }
.file-info { display: none; margin-top: 16px; padding: 12px 16px; background: rgba(34,197,94,0.1); border-radius: 8px; border: 1px solid rgba(34,197,94,0.2); }
.file-info.show { display: flex; align-items: center; gap: 12px; }
.file-info .name { flex: 1; font-size: 14px; }
.file-info .size { font-size: 12px; color: #94a3b8; }
.form-row { display: flex; gap: 16px; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 200px; }
.form-group label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
.form-group select, .form-group input { width: 100%; padding: 10px 12px; background: #0f0f13; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
.form-group select:focus, .form-group input:focus { border-color: #6366f1; }
.form-group select option { background: #1a1a2e; }
.toggle-row { display: flex; gap: 24px; flex-wrap: wrap; }
.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { display: none; }
.toggle-slider { width: 40px; height: 22px; background: #333; border-radius: 11px; position: relative; transition: .3s; }
.toggle-slider::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: .3s; }
.toggle input:checked + .toggle-slider { background: #6366f1; }
.toggle input:checked + .toggle-slider::after { left: 20px; }
.toggle-label { font-size: 14px; color: #94a3b8; }
.btn { padding: 12px 32px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; transition: all .3s; font-weight: 600; }
.btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; width: 100%; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(99,102,241,0.3); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.status-card { display: none; }
.status-card.show { display: block; }
.progress-bar { width: 100%; height: 8px; background: #0f0f13; border-radius: 4px; overflow: hidden; margin: 16px 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6); border-radius: 4px; transition: width .5s; width: 0; }
.status-text { text-align: center; font-size: 15px; color: #94a3b8; }
.status-text.processing { color: #6366f1; }
.status-text.completed { color: #22c55e; }
.status-text.error { color: #ef4444; }
.result-video { display: none; margin-top: 16px; }
.result-video.show { display: block; }
.result-video video { width: 100%; border-radius: 8px; max-height: 400px; }
.model-tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.model-tag { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #94a3b8; transition: all .3s; }
.model-tag:hover { border-color: #6366f1; color: #fff; }
.model-tag.active { background: #6366f1; border-color: #6366f1; color: #fff; }
.style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.style-card { padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: all .3s; text-align: center; background: #0f0f13; }
.style-card:hover { border-color: #6366f1; transform: translateY(-2px); }
.style-card.active { border-color: #6366f1; background: rgba(99,102,241,0.1); }
.style-emoji { font-size: 32px; margin-bottom: 8px; }
.style-name { font-size: 14px; font-weight: 600; }
.style-desc { font-size: 12px; color: #64748b; margin-top: 4px; }
.features-list { display: flex; gap: 8px; flex-wrap: wrap; }
.feature-tag { padding: 4px 12px; border-radius: 6px; font-size: 12px; background: rgba(99,102,241,0.15); color: #818cf8; border: 1px solid rgba(99,102,241,0.2); }
@media (max-width: 640px) { .container { padding: 16px 12px; } .header { padding: 16px 20px; } }
</style>
</head>
<body>
<div class="header">
  <h1>AI 智能视频剪辑</h1>
  <p>上传视频，AI 自动为你剪辑精彩片段</p>
</div>

<div class="container">
  <div class="card">
    <h2>选择剪辑风格</h2>
    <div class="style-grid" id="styleGrid"></div>
  </div>

  <div class="card">
    <h2>选择模型</h2>
    <div class="model-tags" id="modelTags"></div>
  </div>

  <div class="card">
    <h2>视频来源</h2>
    <div style="display:flex;gap:12px;margin-bottom:16px">
      <button class="model-tag active" id="tabUpload" onclick="switchTab('upload')">📁 本地上传</button>
      <button class="model-tag" id="tabUrl" onclick="switchTab('url')">🔗 视频链接</button>
    </div>
    <div id="uploadSection">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📹</div>
        <div class="upload-text">点击或拖拽上传视频</div>
        <div class="upload-hint">支持 MP4 / MOV / AVI，最大 1GB</div>
      </div>
      <input type="file" id="fileInput" accept="video/*" style="display:none">
      <div class="file-info" id="fileInfo">
        <span>📁</span>
        <span class="name" id="fileName"></span>
        <span class="size" id="fileSize"></span>
      </div>
    </div>
    <div id="urlSection" style="display:none">
      <div class="form-group">
        <label>视频直链 URL</label>
        <input type="url" id="videoUrl" placeholder="https://example.com/video.mp4" style="background:#0f0f13;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:14px;padding:12px;width:100%;outline:none">
      </div>
      <div class="file-info" id="urlInfo" style="display:none;margin-top:12px">
        <span>🔗</span>
        <span class="name" id="urlDisplay"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="form-row">
      <div class="form-group">
        <label>剪辑时长（秒）</label>
        <input type="number" id="duration" value="30" min="5" max="300">
      </div>
      <div class="form-group">
        <label>额外功能</label>
        <div class="features-list" id="featuresList">
          <span class="feature-tag">⚡ 智能卡点</span>
          <span class="feature-tag">🎵 背景音乐</span>
          <span class="feature-tag">📝 自动字幕</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <button class="btn btn-primary" id="startBtn" disabled>开始 AI 剪辑</button>
  </div>

  <div class="card status-card" id="statusCard">
    <h2>处理进度</h2>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status-text" id="statusText">正在初始化...</div>
    <div class="result-video" id="resultVideo">
      <video controls id="previewVideo"></video>
    </div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
let selectedFile = null;
let selectedStyle = 'trending';
let selectedModel = 'local-basic';
let pollingTimer = null;
let inputMode = 'upload';

function switchTab(mode) {
  inputMode = mode;
  document.getElementById('tabUpload').classList.toggle('active', mode === 'upload');
  document.getElementById('tabUrl').classList.toggle('active', mode === 'url');
  document.getElementById('uploadSection').style.display = mode === 'upload' ? 'block' : 'none';
  document.getElementById('urlSection').style.display = mode === 'url' ? 'block' : 'none';
}

function validateUrl(url) {
  return url.match(/\.(mp4|mov|avi|webm|mkv)(\?.*)?$/i) || url.includes('cloud') || url.includes('video') || url.includes('storage') || url.includes('cdn');
}

async function loadStyles() {
  try {
    const res = await fetch(`${API_BASE}/api/ai-edit/styles`);
    const data = await res.json();
    const grid = document.getElementById('styleGrid');
    grid.innerHTML = data.styles.map(s => `
      <div class="style-card ${s.id === selectedStyle ? 'active' : ''}" onclick="selectStyle('${s.id}')">
        <div class="style-emoji">${s.emoji}</div>
        <div class="style-name">${s.name}</div>
        <div class="style-desc">${s.description}</div>
      </div>
    `).join('');
  } catch (e) { console.error('Failed to load styles:', e); }
}

async function loadModels() {
  try {
    const res = await fetch(`${API_BASE}/api/ai-edit/models`);
    const data = await res.json();
    const all = [...data.models.local, ...data.models.cloud];
    const container = document.getElementById('modelTags');
    container.innerHTML = all.map(m => `
      <button class="model-tag ${m.id === selectedModel ? 'active' : ''}" onclick="selectModel('${m.id}')">
        ${m.emoji} ${m.name}
      </button>
    `).join('');
  } catch (e) { console.error('Failed to load models:', e); }
}

function selectStyle(id) {
  selectedStyle = id;
  document.querySelectorAll('.style-card').forEach(c => c.classList.toggle('active', c.querySelector('.style-name').textContent === document.querySelector(`[onclick="selectStyle('${id}')"] .style-name`).textContent));
  document.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`[onclick="selectStyle('${id}')"]`).classList.add('active');
}

function selectModel(id) {
  selectedModel = id;
  document.querySelectorAll('.model-tag').forEach(t => t.classList.toggle('active', t.textContent.includes(document.querySelector(`[onclick="selectModel('${id}')"]`)?.textContent.slice(2) || '')));
  document.querySelectorAll('.model-tag').forEach(t => t.classList.remove('active'));
  document.querySelector(`[onclick="selectModel('${id}')"]`).classList.add('active');
}

document.getElementById('uploadZone').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('uploadZone').addEventListener('dragover', (e) => { e.preventDefault(); document.getElementById('uploadZone').classList.add('active'); });
document.getElementById('uploadZone').addEventListener('dragleave', () => document.getElementById('uploadZone').classList.remove('active'));
document.getElementById('uploadZone').addEventListener('drop', (e) => { e.preventDefault(); document.getElementById('uploadZone').classList.remove('active'); handleFile(e.dataTransfer.files[0]); });
document.getElementById('fileInput').addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });
document.getElementById('videoUrl').addEventListener('input', function() {
  const url = this.value.trim();
  if (url) {
    document.getElementById('urlDisplay').textContent = url;
    document.getElementById('urlInfo').style.display = 'flex';
    document.getElementById('startBtn').disabled = false;
  } else {
    document.getElementById('urlInfo').style.display = 'none';
    if (inputMode === 'url') document.getElementById('startBtn').disabled = true;
  }
});

function handleFile(file) {
  if (!file || !file.type.startsWith('video/')) { alert('请选择视频文件'); return; }
  if (file.size > 1024 * 1024 * 1024) { alert('文件不能超过1GB'); return; }
  selectedFile = file;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileSize').textContent = (file.size / 1024 / 1024).toFixed(1) + ' MB';
  document.getElementById('fileInfo').classList.add('show');
  document.getElementById('startBtn').disabled = false;
}

document.getElementById('startBtn').addEventListener('click', startEdit);

async function startEdit() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = '处理中...';
  document.getElementById('statusCard').classList.add('show');
  document.getElementById('progressFill').style.width = '0';
  document.getElementById('statusText').textContent = '正在初始化...';
  document.getElementById('statusText').className = 'status-text processing';
  document.getElementById('resultVideo').classList.remove('show');

  const body = {
    style: selectedStyle,
    duration: document.getElementById('duration').value || '30',
    modelType: selectedModel,
    modelProvider: selectedModel.startsWith('cloud') ? 'cloud' : 'local',
  };

  if (inputMode === 'url') {
    const url = document.getElementById('videoUrl').value.trim();
    if (!url) { showError('请输入视频链接'); return; }
    body.videoUrl = url;
    try {
      const res = await fetch(`${API_BASE}/api/ai-edit/start-url`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.success) startPolling(data.taskId);
      else showError(data.message || '启动失败');
    } catch (e) { showError('网络错误: ' + e.message); }
  } else {
    if (!selectedFile) { showError('请选择视频文件'); return; }
    const form = new FormData();
    form.append('video', selectedFile);
    form.append('style', selectedStyle);
    form.append('duration', document.getElementById('duration').value || '30');
    form.append('modelType', selectedModel);
    form.append('modelProvider', selectedModel.startsWith('cloud') ? 'cloud' : 'local');
    try {
      const res = await fetch(`${API_BASE}/api/ai-edit/start`, { method: 'POST', body: form });
      const data = await res.json();
      if (data.success) startPolling(data.taskId);
      else showError(data.message || '启动失败');
    } catch (e) { showError('网络错误: ' + e.message); }
  }
}

function startPolling(taskId) {
  if (pollingTimer) clearInterval(pollingTimer);
  pollingTimer = setInterval(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/ai-edit/status/${taskId}`);
      const data = await res.json();
      if (data.success) {
        document.getElementById('progressFill').style.width = data.progress + '%';
        document.getElementById('statusText').textContent = data.currentStep;
        if (data.status === 'completed') {
          clearInterval(pollingTimer);
          document.getElementById('statusText').className = 'status-text completed';
          document.getElementById('startBtn').disabled = false;
          document.getElementById('startBtn').textContent = '开始 AI 剪辑';
        } else if (data.status === 'error') {
          clearInterval(pollingTimer);
          showError(data.error || '处理失败');
        }
      }
    } catch (e) {
      console.error('Polling error:', e);
    }
  }, 1000);
}

function showError(msg) {
  document.getElementById('statusText').textContent = msg;
  document.getElementById('statusText').className = 'status-text error';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').textContent = '开始 AI 剪辑';
  if (pollingTimer) clearInterval(pollingTimer);
}

loadStyles();
loadModels();
</script>
</body>
</html>
